name: typecheck-no-new-errors

# 零错误门禁：历史 21 个数量基线已废止，进程失败或缺证据一律拒绝。
# 全仓触发，避免根配置/共享包变更漏跑及 required check 因 paths 被跳过。
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# 取消同分支并发：避免两次 PR push 互相干扰基线计数
concurrency:
  group: typecheck-no-new-errors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASELINE: '0'
      MAX_NEW_ERRORS: '0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.14.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.3
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify typecheck gate counterexamples
        run: |
          python3 scripts/test_engineering_harness.py
          node --test scripts/typecheck-error-count.test.mjs

      - name: Run typecheck and enforce zero diagnostics
        shell: bash
        run: |
          set +e
          pnpm run check:type > /tmp/typecheck-output.txt 2>&1
          TYPECHECK_EXIT=$?
          set -e
          cat /tmp/typecheck-output.txt
          node scripts/typecheck-error-count.mjs \
            --input=/tmp/typecheck-output.txt \
            --typecheck-exit-code=${TYPECHECK_EXIT} \
            --baseline=${BASELINE} \
            --max-new-errors=${MAX_NEW_ERRORS} \
            --output=typecheck-report.json

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-report
          path: typecheck-report.json
          if-no-files-found: error
